name: Setup pinned SwiftLint
description: >-
  Install SwiftLint from a checksum-pinned official release binary instead of
  `brew install swiftlint`, so an upstream SwiftLint release cannot turn PR CI
  or the release gate red with zero repo changes, and so a released version of
  this repo always lints with the same linter.

inputs:
  version:
    description: SwiftLint release tag to install.
    required: false
    default: '0.65.1'
  sha256:
    description: >-
      Expected SHA-256 of portable_swiftlint.zip for the pinned version. The
      upstream release publishes no checksum for this asset, so this is a
      trust-on-first-use pin computed from the artifact that `brew install
      swiftlint` resolved on 2026-09-27 (Homebrew stable was also 0.65.1).
      Bumping `version` requires re-computing this value.
    required: false
    default: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'

runs:
  using: composite
  steps:
    - name: Install SwiftLint ${{ inputs.version }} (pinned)
      shell: bash
      env:
        SWIFTLINT_VERSION: ${{ inputs.version }}
        SWIFTLINT_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        BIN_DIR="$RUNNER_TEMP/swiftlint-bin"
        ZIP_PATH="$RUNNER_TEMP/portable_swiftlint.zip"
        rm -rf "$BIN_DIR"
        mkdir -p "$BIN_DIR"

        URL="https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
        echo "Downloading pinned SwiftLint ${SWIFTLINT_VERSION} from ${URL}"
        curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
          --max-time 120 -o "$ZIP_PATH" "$URL"

        # Fail closed on any content change, including a re-tagged release.
        printf '%s  %s\n' "$SWIFTLINT_SHA256" "$ZIP_PATH" | shasum -a 256 --check --status - \
          || {
            echo "::error::SwiftLint ${SWIFTLINT_VERSION} checksum mismatch."
            echo "Expected: ${SWIFTLINT_SHA256}"
            echo "Actual:   $(shasum -a 256 "$ZIP_PATH" | cut -d' ' -f1)"
            exit 1
          }

        unzip -oq "$ZIP_PATH" swiftlint -d "$BIN_DIR"
        chmod +x "$BIN_DIR/swiftlint"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

        echo "Installed: $("$BIN_DIR/swiftlint" --version)"
