name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact version commit produced by a successful Prepare Release job
        required: true
        type: string
      validated_sha:
        description: CI-validated parent commit used to prepare the release
        required: true
        type: string
      prepare_run_id:
        description: Automatic Publish run that prepared the version commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # The self-dispatched publish run queues until preparation has fully exited.
  # This also prevents a new preparation from overlapping an active publish.
  group: publish-main
  cancel-in-progress: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Automatic runs accept only a successful CI result for a trusted push to
  # main. Dispatch runs accept only the exact child commit produced by the
  # successful preparation job; the originating run may have failed only while
  # dispatching that proven commit, which keeps manual recovery auditable.
  release-context:
    name: Release Context
    runs-on: ubuntu-latest
    # A handful of `gh api` provenance calls; 5 min is generous and stops a wedged
    # API call from holding the `publish-main` concurrency slot for 6 hours.
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    outputs:
      release_sha: ${{ steps.context.outputs.release_sha }}
      validated_sha: ${{ steps.context.outputs.validated_sha }}
      prepare_run_id: ${{ steps.context.outputs.prepare_run_id }}

    steps:
      - name: Resolve validated commit
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_VALIDATED_SHA: ${{ inputs.validated_sha }}
          DISPATCH_PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          EVENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RELEASE_SHA="$AUTOMATIC_SHA"
            VALIDATED_SHA="$AUTOMATIC_SHA"
            PREPARE_RUN_ID="$CURRENT_RUN_ID"
          else
            RELEASE_SHA="$DISPATCH_RELEASE_SHA"
            VALIDATED_SHA="$DISPATCH_VALIDATED_SHA"
            PREPARE_RUN_ID="$DISPATCH_PREPARE_RUN_ID"

            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [[ ! "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
               [[ ! "$PREPARE_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "Dispatch inputs must contain full commit SHAs and a numeric preparation run ID."
              exit 1
            fi
            if [ "$EVENT_SHA" != "$RELEASE_SHA" ]; then
              echo "Dispatch resolved $EVENT_SHA, not prepared release $RELEASE_SHA; refusing stale provenance."
              exit 1
            fi
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "validated_sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          echo "prepare_run_id=$PREPARE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify dispatched release lineage
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
          VALIDATED_SHA: ${{ steps.context.outputs.validated_sha }}
          PREPARE_RUN_ID: ${{ steps.context.outputs.prepare_run_id }}
        run: |
          MAIN_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" != "$RELEASE_SHA" ]; then
            echo "main is $MAIN_SHA, not prepared release $RELEASE_SHA; refusing stale publication."
            exit 1
          fi

          PARENT_COUNT="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA" --jq '.parents | length')"
          PARENT_SHA="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA" --jq '.parents[0].sha // ""')"
          if [ "$PARENT_COUNT" != "1" ] || [ "$PARENT_SHA" != "$VALIDATED_SHA" ]; then
            echo "$RELEASE_SHA is not the single-child version commit of validated SHA $VALIDATED_SHA."
            exit 1
          fi

          RUN_PATH="$(gh api "repos/$GH_REPO/actions/runs/$PREPARE_RUN_ID" --jq '.path')"
          RUN_EVENT="$(gh api "repos/$GH_REPO/actions/runs/$PREPARE_RUN_ID" --jq '.event')"
          RUN_SHA="$(gh api "repos/$GH_REPO/actions/runs/$PREPARE_RUN_ID" --jq '.head_sha')"
          RUN_BRANCH="$(gh api "repos/$GH_REPO/actions/runs/$PREPARE_RUN_ID" --jq '.head_branch')"
          if [ "$RUN_PATH" != ".github/workflows/publish.yml" ] ||
             [ "$RUN_EVENT" != "workflow_run" ] ||
             [ "$RUN_SHA" != "$VALIDATED_SHA" ] ||
             [ "$RUN_BRANCH" != "main" ]; then
            echo "Run $PREPARE_RUN_ID is not the trusted preparation run for $VALIDATED_SHA."
            exit 1
          fi

          RECOVERABLE_ATTEMPT_COUNT="$(
            gh api "repos/$GH_REPO/actions/runs/$PREPARE_RUN_ID/jobs?filter=all&per_page=100" \
              --jq '
                [
                  .jobs[] |
                  select(.name == "Prepare Release") |
                  select(.conclusion == "success") |
                  select(any(.steps[]; .name == "Validate versioned packages" and .conclusion == "success")) |
                  select(any(.steps[]; .name == "Push version commit" and .conclusion == "success")) |
                  .run_attempt
                ] as $prepared_attempts |
                [
                  $prepared_attempts[] as $attempt |
                  select(
                    [
                      .jobs[] |
                      select(.run_attempt == $attempt) |
                      select(.conclusion != "success" and .conclusion != "skipped") |
                      .name
                    ] |
                    all(. == "Dispatch Prepared Release")
                  )
                ] |
                length
              '
          )"
          if [ "$RECOVERABLE_ATTEMPT_COUNT" = "0" ]; then
            echo "Run $PREPARE_RUN_ID has no attempt with a proven preparation and no failure outside dispatch."
            exit 1
          fi

  # ── Check if there are changeset changes ────────────────
  changesets:
    name: Changeset Status
    runs-on: ubuntu-latest
    # Checkout + bun install + `changeset status`: ~3-5 min. 10 min ceiling.
    timeout-minutes: 10
    needs: release-context
    if: github.event_name == 'workflow_run'
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for changesets
        id: changesets
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          echo "Checking for changesets..."
          mapfile -t CHANGESET_FILES < <(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | sort)

          if [ "${#CHANGESET_FILES[@]}" -eq 0 ]; then
            echo "hasChangesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets found"
            exit 0
          fi

          echo "hasChangesets=true" >> "$GITHUB_OUTPUT"
          echo "Found ${#CHANGESET_FILES[@]} changeset(s):"
          printf '  %s\n' "${CHANGESET_FILES[@]}"
          # An exact-SHA checkout is detached. Changesets resolves its configured
          # base branch by local name, so anchor that name to the validated SHA.
          git branch --force main "$RELEASE_SHA"
          bun run version:check -- --verbose

  # ── TypeScript validation ────────────────────────────────
  # The release-gate jobs below only run when there are changesets to publish:
  # ci.yml already validated this exact commit, so a push without changesets
  # (docs, chores) must not repeat full native builds on macOS runners.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # Same gate set as ci.yml's `typescript` job (~8-12 min cold); 20 min ceiling.
    timeout-minutes: 20
    needs: [release-context, changesets]
    if: github.event_name == 'workflow_run' && needs.changesets.outputs.hasChangesets == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-1.3.8-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.8-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Native module contract check
        run: bun run contracts:check

      - name: Build
        run: bun run build

      - name: Smoke-test packed CLI scaffold
        run: bun run smoke:cli

      - name: Test
        run: bun run test:ts

      - name: Dead code check
        run: bun run knip

      - name: Validate Git hooks
        run: bun run hooks:validate

  # ── Native builds validation ─────────────────────────────
  native-builds:
    name: Native Builds
    runs-on: macos-15
    # This job is ci.yml's swift-ios + swift-macos work on a single 10x-billed
    # macOS runner: SwiftLint, two xcodebuild builds, the full iOS test suite,
    # then build+test of VueNativeShared and VueNativeMacOS. ~55-65 min cold with
    # a cache miss. 75 min leaves headroom without letting a hung xcodebuild or
    # swift-test hold a macOS runner for GitHub's 360 min default.
    timeout-minutes: 75
    needs: [release-context, changesets]
    if: github.event_name == 'workflow_run' && needs.changesets.outputs.hasChangesets == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}

      # Pinned + checksum-verified instead of `brew install swiftlint`: the
      # release gate must be reproducible, and an upstream SwiftLint release must
      # not be able to block a publication that ci.yml already approved.
      - name: Install SwiftLint
        uses: ./.github/actions/setup-swiftlint

      - name: Lint Swift
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd native/ios
          swiftlint lint --strict --reporter github-actions-logging 2>&1 |
            tee "$GITHUB_WORKSPACE/artifacts/swiftlint-release.txt"

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
            native/ios/VueNativeCore/.build
            native/shared/VueNativeShared/.build
            native/macos/VueNativeMacOS/.build
          # `xcode-default` matches ci.yml's PR key exactly (same hashFiles order,
          # same runner OS, same image-default Xcode), so the release gate restores
          # the warm build products the merged PR already produced instead of
          # rebuilding everything on macOS minutes.
          key: ${{ runner.os }}-swift-xcode-default-${{ hashFiles('Package.swift', 'native/ios/VueNativeCore/Package.swift', 'native/shared/VueNativeShared/Package.swift', 'native/macos/VueNativeMacOS/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-xcode-default-
            ${{ runner.os }}-swift-

      - name: Build VueNativeCore for iOS Simulator (in-repo package)
        run: |
          cd native/ios/VueNativeCore
          xcodebuild build \
            -scheme VueNativeCore \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

      - name: Validate root Package.swift (consumer-facing SPM target)
        run: |
          xcodebuild build \
            -scheme VueNativeCore \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation

      - name: Test VueNativeCore
        run: |
          SIMULATOR_ID="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"].values(); phones = (device for runtime in devices for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")); print(next(phones)["udid"])'
          )"
          cd native/ios/VueNativeCore
          xcodebuild test \
            -scheme VueNativeCore \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults.xcresult

      - name: Build VueNativeShared
        run: |
          cd native/shared/VueNativeShared
          swift build

      - name: Test VueNativeShared
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd native/shared/VueNativeShared
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/swift-shared-test.log"

      - name: Validate root VueNativeMacOS product
        run: swift build --target VueNativeMacOS

      - name: Build VueNativeMacOS
        run: |
          cd native/macos/VueNativeMacOS
          swift build

      - name: Test VueNativeMacOS
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd native/macos/VueNativeMacOS
          swift test 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/swift-macos-test.log"

      # A red release gate used to be a wall of xcodebuild/swift log with no
      # per-test detail and no lint report. Upload on failure — the only time
      # any of it matters.
      - name: Upload release-gate iOS test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-ios-xcresult
          path: native/ios/VueNativeCore/TestResults.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          compression-level: 0

      - name: Upload release-gate Swift logs and lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-swift-logs
          path: |
            artifacts/swift-shared-test.log
            artifacts/swift-macos-test.log
            artifacts/swiftlint-release.txt
          if-no-files-found: ignore
          retention-days: 14

  # ── Android build validation ─────────────────────────────
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    # Mirrors ci.yml's `kotlin` job: ktlint + compileDebugKotlin + assembleRelease
    # + two unit-test tasks, ~12-18 min cold. 30 min ceiling.
    timeout-minutes: 30
    needs: [release-context, changesets]
    if: github.event_name == 'workflow_run' && needs.changesets.outputs.hasChangesets == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-context.outputs.release_sha }}

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            native/android/.gradle
          # Hash the version catalog and module build file too, so a dependency
          # bump invalidates the key instead of restoring a stale dependency cache.
          key: ${{ runner.os }}-gradle-${{ hashFiles('native/android/build.gradle.kts', 'native/android/gradle/libs.versions.toml', 'native/android/VueNativeCore/build.gradle.kts', 'native/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Lint Kotlin
        run: ./gradlew :VueNativeCore:ktlintCheck
        working-directory: native/android

      - name: Build VueNativeCore
        run: ./gradlew :VueNativeCore:compileDebugKotlin :VueNativeCore:assembleRelease
        working-directory: native/android

      - name: Test VueNativeCore
        run: ./gradlew :VueNativeCore:testDebugUnitTest :VueNativeCore:testReleaseUnitTest
        working-directory: native/android

      - name: Upload release-gate Android test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-android-junit-results
          path: native/android/**/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release-gate Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-android-reports
          path: native/android/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ── Prepare an exact version commit ─────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    # Full-history checkout + bun install + `changeset version` + the whole
    # `check:ts` gate (lint, typecheck, contracts, vue cohort, metadata, build,
    # packed-scaffold smoke, tests, knip, hooks) + push: ~12-18 min. 30 min
    # ceiling. Timing out here is safe — nothing is published until `publish`.
    timeout-minutes: 30
    needs: [release-context, changesets, validate, native-builds, android-build]
    if: github.event_name == 'workflow_run' && needs.changesets.outputs.hasChangesets == 'true'
    outputs:
      version_sha: ${{ steps.version_commit.outputs.version_sha }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.release-context.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify validated commit is still main
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "main moved from validated commit $RELEASE_SHA to $REMOTE_SHA; refusing to publish stale code."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version bump
        run: |
          bun run version

          if git diff --quiet HEAD -- .; then
            echo "A Changeset was detected, but it produced no version changes. Refusing to publish."
            exit 1
          fi

      - name: Refresh versioned dependencies
        run: |
          bun install
          bun run package-metadata:sync

      - name: Validate versioned packages
        run: bun run check:ts

      - name: Commit version bump
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "Versioning produced no committable changes."
            exit 1
          fi
          git commit -m "chore: bump versions [skip ci]"

      - name: Push version commit
        id: version_commit
        run: |
          # --no-verify: the pre-push hook (lefthook -> check:ts) is built for
          # interactive machines and hangs indefinitely when git invokes it in
          # Actions, stalling this step forever. The version commit was already
          # fully validated by the "Validate versioned packages" step above.
          git push --no-verify origin HEAD:main
          echo "version_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Dispatch publication after preparation succeeds ─────
  dispatch:
    name: Dispatch Prepared Release
    runs-on: ubuntu-latest
    # Two `gh api` calls and one `gh workflow run`; 5 min is ample. A stuck
    # dispatch must not hold the `publish-main` concurrency slot.
    timeout-minutes: 5
    needs: [release-context, prepare]
    if: github.event_name == 'workflow_run' && needs.prepare.result == 'success'
    permissions:
      actions: write
      contents: read

    steps:
      - name: Dispatch prepared release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_SHA: ${{ needs.prepare.outputs.version_sha }}
          VALIDATED_SHA: ${{ needs.release-context.outputs.validated_sha }}
          PREPARE_RUN_ID: ${{ github.run_id }}
        run: |
          REMOTE_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$REMOTE_SHA" != "$VERSION_SHA" ]; then
            echo "main moved from prepared release $VERSION_SHA to $REMOTE_SHA; refusing to dispatch."
            exit 1
          fi

          gh workflow run publish.yml \
            --repo "$GH_REPO" \
            --ref main \
            --raw-field "release_sha=$VERSION_SHA" \
            --raw-field "validated_sha=$VALIDATED_SHA" \
            --raw-field "prepare_run_id=$PREPARE_RUN_ID"

  # ── Publish an already-versioned exact commit ───────────
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    # Ceiling, not an estimate of a healthy run (~20 min). The bounded retry loop
    # in "Verify npm release" is the dominant term: 30 attempts of exponential
    # backoff (5 s doubling to a 60 s cap, ~27 min of waiting) each doing an
    # npm install of the published packages plus `npm audit signatures`, so
    # roughly 35-45 min worst case, plus `check:ts` (~12 min), the Gradle
    # publish to GitHub Packages (~5 min) and tagging (~2 min). 90 min keeps
    # headroom while capping a hung registry/OIDC call at a quarter of
    # GitHub's 360 min default. Timing out here is recoverable by re-running
    # the workflow: Changesets skips versions that already exist and the tag
    # preflight below is idempotent, which is exactly why the retry loop is
    # safe to bound. Propagation waits back off; cryptographic rejections and
    # non-propagation install failures exit immediately instead of burning the
    # whole window.
    timeout-minutes: 90
    needs: release-context
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ needs.release-context.outputs.release_sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify prepared commit is still main
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "main moved from prepared release $RELEASE_SHA to $REMOTE_SHA; refusing to publish stale code."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted publishing toolchain
        shell: bash
        run: |
          npm install --global npm@11.18.0
          echo "Node $(node --version)"
          echo "npm v$(npm --version)"

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC is unavailable. Ensure this job has id-token: write permission."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate prepared release
        run: bun run check:ts

      - name: Resolve release metadata
        id: release
        run: |
          if git diff --quiet HEAD^ HEAD -- packages/runtime/package.json; then
            echo "framework_changed=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./packages/runtime/package.json').version")"
            echo "framework_changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Version: $VERSION"
          fi

      - name: Preflight release tag
        if: steps.release.outputs.version != ''
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TAG_REF="refs/tags/v$VERSION"
          if git ls-remote --exit-code origin "$TAG_REF" >/dev/null 2>&1; then
            git fetch --force origin "$TAG_REF:$TAG_REF"
            EXISTING_SHA="$(git rev-list -n 1 "$TAG_REF")"
            if [ "$EXISTING_SHA" != "$RELEASE_SHA" ]; then
              echo "v$VERSION points to $EXISTING_SHA, not release $RELEASE_SHA."
              exit 1
            fi
            echo "v$VERSION already points to $RELEASE_SHA; finalization will reuse it."
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              echo "Could not determine whether v$VERSION already exists."
              exit "$STATUS"
            fi
          fi

      - name: Resolve and preflight npm package tags
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          REPORT_FILE="$RUNNER_TEMP/npm-release-tags.json"
          TARGETS_FILE="$RUNNER_TEMP/npm-release-targets.txt"
          bun scripts/sync-release-tags.mjs \
            --release-sha "$RELEASE_SHA" \
            --dry-run \
            --json > "$REPORT_FILE"
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs")
            const [reportPath, targetsPath] = process.argv.slice(1)
            const report = JSON.parse(readFileSync(reportPath, "utf8"))
            const targets = report.results.map(result => result.tag)
            if (targets.length === 0) throw new Error("No npm release targets were resolved")
            writeFileSync(targetsPath, `${targets.join("\n")}\n`)
          ' "$REPORT_FILE" "$TARGETS_FILE"
          echo "Resolved npm release targets:"
          sed 's/^/  /' "$TARGETS_FILE"

      - name: Reverify prepared commit is still main
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: |
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "main moved from prepared release $RELEASE_SHA to $REMOTE_SHA; refusing to publish stale code."
            exit 1
          fi

      # Re-running this workflow run keeps GITHUB_RUN_ID stable, and Changesets
      # skips versions that already exist, so partial npm publication is safe.
      - name: Publish to npm
        run: bun run release

      - name: Verify npm release
        env:
          EXPECTED_REF: refs/heads/main
          NPM_CONFIG_FETCH_RETRIES: 2
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 5000
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
          NPM_CONFIG_FETCH_TIMEOUT: 15000
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERIFY_DIR="$RUNNER_TEMP/npm-release-verification"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          cp "$RUNNER_TEMP/npm-release-targets.txt" "$VERIFY_DIR/targets.txt"

          if [ ! -s "$VERIFY_DIR/targets.txt" ]; then
            echo "No public package versions were found in the prepared release."
            exit 1
          fi

          cd "$VERIFY_DIR"
          npm init --yes >/dev/null
          mapfile -t TARGETS < targets.txt

          # Propagation vs fatal. An ETARGET/E404 from `npm install` means the
          # registry does not have the version yet and is worth waiting for;
          # anything else (auth, tarball corruption) is not. A cryptographic
          # verification rejection is fatal immediately — retrying it for half
          # an hour only delays the alert. Backoff doubles to a 60 s cap, giving
          # ~27 min of waiting across 30 attempts. The 2026-09-28 0.21.0 release
          # died here because 72 flat 5 s sleeps (~8 min) under-ran real
          # propagation for @thelacanians/vue-native-cli: npm had all four
          # packages but this step still failed, leaving Maven, tags and the
          # GitHub Release unwritten until a manual re-dispatch.
          VERIFIED=false
          DELAY=5
          for ATTEMPT in {1..30}; do
            rm -rf node_modules package-lock.json audit.json
            INSTALL_LOG="$RUNNER_TEMP/npm-install-attempt-$ATTEMPT.log"
            if ! npm install --ignore-scripts --no-audit --no-fund --save-exact "${TARGETS[@]}" >"$INSTALL_LOG" 2>&1; then
              if grep -qE "ETARGET|E404|ENOTFOUND" "$INSTALL_LOG"; then
                echo "attempt $ATTEMPT: registry has not propagated yet; retrying in ${DELAY}s"
                sleep "$DELAY"
                DELAY=$(( DELAY < 60 ? DELAY * 2 : 60 ))
                continue
              fi
              echo "::error::npm install failed for a non-propagation reason"
              tail -20 "$INSTALL_LOG"
              exit 1
            fi
            if npm audit signatures --json --include-attestations > audit.json; then
              if node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')

          const audit = JSON.parse(readFileSync('audit.json', 'utf8'))
          const targets = readFileSync('targets.txt', 'utf8').trim().split('\n')
          const repository = process.env.REPOSITORY
          const releaseSha = process.env.RELEASE_SHA
          const expectedRef = process.env.EXPECTED_REF
          const expectedRepositoryURL = `https://github.com/${repository}`
          const expectedSourceURI = `git+https://github.com/${repository}@${expectedRef}`

          if (audit.invalid?.length || audit.missing?.length) {
            throw new Error('npm reported invalid or missing registry signatures')
          }

          for (const spec of targets) {
            const separator = spec.lastIndexOf('@')
            const name = spec.slice(0, separator)
            const version = spec.slice(separator + 1)
            const verified = audit.verified?.find(
              entry => entry.name === name && entry.version === version,
            )
            if (!verified) throw new Error(`${spec} was not verified by npm`)
            if (verified.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
              throw new Error(`${spec} has no verified SLSA provenance`)
            }

            const provenance = verified.attestationBundles?.find(
              attestation => attestation.predicateType === 'https://slsa.dev/provenance/v1',
            )
            const envelope = provenance?.bundle?.dsseEnvelope
            if (envelope?.payloadType !== 'application/vnd.in-toto+json') {
              throw new Error(`${spec} has an unexpected provenance payload type`)
            }
            const statement = JSON.parse(Buffer.from(envelope.payload, 'base64').toString('utf8'))
            if (statement._type !== 'https://in-toto.io/Statement/v1' ||
                statement.predicateType !== 'https://slsa.dev/provenance/v1') {
              throw new Error(`${spec} has an unexpected provenance statement type`)
            }

            const build = statement.predicate?.buildDefinition
            const workflow = build?.externalParameters?.workflow
            if (workflow?.repository !== expectedRepositoryURL ||
                workflow?.path?.replace(/^\/+/, '') !== '.github/workflows/publish.yml' ||
                workflow?.ref !== expectedRef) {
              throw new Error(`${spec} provenance does not identify this release workflow`)
            }
            const sourceMatches = build?.resolvedDependencies?.some(
              dependency => dependency.uri === expectedSourceURI &&
                dependency.digest?.gitCommit === releaseSha,
            )
            if (!sourceMatches) {
              throw new Error(`${spec} provenance does not resolve to ${releaseSha}`)
            }

            const invocation = new URL(statement.predicate?.runDetails?.metadata?.invocationId)
            const expectedPrefix = `/${repository}/actions/runs/`
            if (invocation.origin !== 'https://github.com' ||
                !invocation.pathname.startsWith(expectedPrefix) ||
                !/\/attempts\/\d+$/.test(invocation.pathname)) {
              throw new Error(`${spec} provenance has an unexpected workflow invocation`)
            }

            const gitHead = JSON.parse(execFileSync(
              'npm', ['view', spec, 'gitHead', '--json'], { encoding: 'utf8' },
            ))
            if (gitHead !== releaseSha) {
              throw new Error(`${spec} gitHead is ${gitHead}, expected ${releaseSha}`)
            }
          }

          process.stdout.write(`npm cryptographically verified ${targets.length} released package(s).\n`)
          NODE
              then
                VERIFIED=true
                break
              fi
              echo "::error::cryptographic verification rejected the release; this is not propagation, not retrying"
              exit 1
            fi
            echo "attempt $ATTEMPT: npm audit signatures failed; retrying in ${DELAY}s"
            sleep "$DELAY"
            DELAY=$(( DELAY < 60 ? DELAY * 2 : 60 ))
          done

          if [ "$VERIFIED" != "true" ]; then
            echo "::error::npm release verification failed after 30 attempts of exponential backoff"
            exit 1
          fi

      # Creates annotated git tags per published package (e.g.
      # @thelacanians/vue-native-runtime@0.18.0). The script itself pushes with
      # --no-verify: after `bun install`, lefthook installs a pre-push hook that
      # runs the full `check:ts` gate and hangs indefinitely in Actions (see
      # scripts/sync-release-tags.mjs and the "Push version commit" step).
      - name: Sync npm package tags
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
        run: bun scripts/sync-release-tags.mjs --release-sha "$RELEASE_SHA"

      - name: Setup Java for Android
        if: steps.release.outputs.framework_changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Publish Android to GitHub Packages
        if: steps.release.outputs.framework_changed == 'true'
        run: |
          set +e
          OUTPUT="$(./gradlew :VueNativeCore:publishReleasePublicationToGitHubPackagesRepository 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if [[ "$OUTPUT" == *"status code 409"* ]] || [[ "$OUTPUT" == *"409 Conflict"* ]]; then
            echo "::warning::Version already exists in GitHub Packages; continuing recovery."
            exit 0
          fi
          exit "$STATUS"
        working-directory: native/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: steps.release.outputs.version != ''
        env:
          RELEASE_SHA: ${{ needs.release-context.outputs.release_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TAG_NAME="v$VERSION"
          TAG_REF="refs/tags/$TAG_NAME"

          if git ls-remote --exit-code origin "$TAG_REF" >/dev/null 2>&1; then
            git fetch --force origin "$TAG_REF:$TAG_REF"
            EXISTING_SHA="$(git rev-list -n 1 "$TAG_REF")"
            if [ "$EXISTING_SHA" != "$RELEASE_SHA" ]; then
              echo "$TAG_NAME points to $EXISTING_SHA, not release $RELEASE_SHA."
              exit 1
            fi
            echo "$TAG_NAME already points to $RELEASE_SHA; continuing recovery."
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              echo "Could not determine whether $TAG_NAME already exists."
              exit "$STATUS"
            fi
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            # --no-verify: the pre-push hook hangs in Actions (see the
            # "Push version commit" step for details).
            git push --no-verify origin "$TAG_REF"
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Pull the section for this version from the runtime CHANGELOG
          # (the fixed-group packages share the same version, so any of them works).
          NOTES=$(awk -v ver="## $VERSION" '
            $0 == ver {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' packages/runtime/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          PUBLISHED_PACKAGES="$(
            while IFS= read -r spec; do
              printf -- '- `%s`\n' "$spec"
            done < "$RUNNER_TEMP/npm-release-targets.txt"
          )"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo ""
            echo "## Published packages"
            echo "$PUBLISHED_PACKAGES"
            echo "- \`com.vuenative:core:$VERSION\` (GitHub Packages, Maven)"
            echo "RELEASE_NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release.outputs.version != ''
        run: |
          TAG_NAME="v$VERSION"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "$RELEASE_NOTES" \
              --latest
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
          VERSION: ${{ steps.release.outputs.version }}
