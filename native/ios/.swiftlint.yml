# SwiftLint Configuration for VueNativeCore
#
# CI runs this from `native/ios` (see .github/workflows/ci.yml → "Lint Swift"), so the
# `included:` paths below are relative to this directory.
#
# SCOPE NOTE: this config only covers the iOS package. `native/shared/VueNativeShared`
# and `native/macos/VueNativeMacOS` are Swift sources with no SwiftLint coverage at all
# — there is no `.swiftlint.yml` for either, and this file's `included:` cannot reach
# them without linting code that the iOS CI job does not own. Adding `../shared/...`
# here was evaluated and rejected: it surfaces violations in files this job cannot fix,
# which turns the iOS lint gate red for unrelated reasons. Closing that gap needs a
# repo-root `.swiftlint.yml` (or a dedicated shared/macos config) wired into its own CI
# job. Tracked separately.

included:
  - VueNativeCore/Sources
  - VueNativeCore/Tests
  # Sibling package holding `<VSVG>`, split out so consumers that never render an
  # SVG do not resolve SVGKit. It is a separate SPM package rather than a second
  # product of VueNativeCore (a second product renames the scheme CI tests), but
  # it is still iOS Swift under this directory and owned by this job — unlike
  # ../shared and ../macos above — so it is linted here rather than left
  # uncovered.
  - VueNativeCoreSVG/Sources
  - VueNativeCoreSVG/Tests

excluded:
  - VueNativeCore/.build
  - VueNativeCoreSVG/.build

# Rules
#
# Nothing here is disabled to hide violations. `force_cast`, `force_try`,
# `file_length`, `function_body_length` and `cyclomatic_complexity` were previously
# all switched off, which made "0 violations under --strict" meaningless. They are now
# enforced; the handful of genuine outliers carry an inline `swiftlint:disable` with a
# reason at the offending site, and `VueNativeCore/Tests/.swiftlint.yml` relaxes
# `force_cast` for test code only.
disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - trailing_comma

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_string
  - first_where
  - modifier_order
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument

# Config

# Prop/style routers in this codebase are long `switch` statements where each case is
# independent, not compounding branches. Counting them inflates the metric without
# signalling real risk, so cases are excluded; the remaining if/else complexity is
# still measured.
#
# The thresholds below are a deliberate ratchet baseline, not an ideal: they are set so
# ordinary code is held to a tight standard while the few structural outliers that
# predate this config carry an explicit inline `swiftlint:disable` with a reason at the
# offending site. Tighten these as those sites are refactored — do not raise them to
# absorb a new violation.
cyclomatic_complexity:
  ignores_case_statements: true
  warning: 20
  error: 40

function_body_length:
  warning: 110
  error: 200

file_length:
  warning: 900
  error: 1600

identifier_name:
  min_length:
    warning: 1
  allowed_symbols:
    - _
  excluded:
    - id
    - x
    - y
    - w
    - h
    - i
    - j
    - k
    - n
    - vc

type_name:
  min_length: 2
  max_length: 60

nesting:
  type_level: 3
  function_level: 5

reporter: xcode
