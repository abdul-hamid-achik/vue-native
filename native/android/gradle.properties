org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# android.enableJetifier removed: every dependency in this build is AndroidX
# already, so Jetifier had nothing to rewrite and only added work to every
# build (it rewrites the whole dependency graph on each configuration).
#
# AGP 8.2.2 does not officially support compileSdk 35. The suppression is
# deliberate — bumping AGP is tracked separately because it also drags Gradle,
# Kotlin and CameraX along with it. Do not raise compileSdk past 35 until AGP is
# bumped (see gradle/libs.versions.toml).
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
