# Version catalog for the Vue Native Android build.
#
# Single source of truth for every dependency version shared between
# :VueNativeCore (the published library) and :app (the example host). Before
# this file existed the same ~25 versions were duplicated as inline strings in
# both build scripts and drifted (app was on compileSdk 34 while the library was
# on 35).
#
# Deliberate exceptions — do NOT move these into the catalog:
#   * J2V8. See the comment next to its dependency in
#     VueNativeCore/build.gradle.kts.
#   * Plugin versions (AGP, Kotlin, ktlint) in the root build.gradle.kts.

[versions]
# --- SDK levels -------------------------------------------------------------
# AGP 8.2.2 does not officially support compileSdk 35; gradle.properties sets
# android.suppressUnsupportedCompileSdk=35 to acknowledge that on purpose. Do not
# raise compileSdk past 35 without bumping AGP first (and re-verifying CameraX,
# which is pinned for the same reason).
compileSdk = "35"
minSdk = "21"
targetSdk = "35"

# --- AndroidX ---------------------------------------------------------------
androidxCore = "1.12.0"
androidxAppcompat = "1.6.1"
androidxLifecycle = "2.7.0"
androidxRecyclerview = "1.3.2"
androidxWebkit = "1.10.0"
androidxSwiperefreshlayout = "1.1.0"
androidxWork = "2.8.1"
androidxBiometric = "1.1.0"
androidxSecurityCrypto = "1.1.0-alpha06"
androidxCredentials = "1.2.2"
# CameraX is pinned to 1.4.2: 1.5.x/1.6.x need compileSdk 36 and AGP 8.9+.
androidxCamera = "1.4.2"

# --- Google / third-party ---------------------------------------------------
material = "1.11.0"
flexbox = "3.0.0"
coil = "2.7.0"
androidsvg = "1.4"
okhttp = "4.12.0"
kotlinxCoroutines = "1.7.3"
playServicesLocation = "21.1.0"
billing = "7.0.0"
googleId = "1.1.1"
mlkitBarcodeScanning = "17.3.0"

# --- Test -------------------------------------------------------------------
junit = "4.13.2"
robolectric = "4.11.1"
androidxTestCore = "1.5.0"
androidxTestJunit = "1.1.5"
mockk = "1.13.9"
truth = "1.1.5"
# Host-boot tests evaluate the committed JS fixture on the JVM; J2V8's Android
# AAR cannot create a V8 isolate there.
rhino = "1.7.15"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }

material = { module = "com.google.android.material:material", version.ref = "material" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
androidsvg = { module = "com.caverock:androidsvg", version.ref = "androidsvg" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcodeScanning" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
